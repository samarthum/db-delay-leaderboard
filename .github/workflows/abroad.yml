name: Stops and history abroad

# Cross-border trains (docs/notes/live-and-international.md):
#   stops    every stop abroad of each train that crosses the border, from Transitous (scripts/foreign_stops.mjs ->
#            data/foreign-stops.json). Weekly (timetables change; trains not running in the next two days keep their
#            last entry), committed to main only when that file is the only change and it did not shrink.
#   history  how late each train usually is at its stops abroad, for the site's window (scripts/abroad_history.py ->
#            data/abroad-history.json), re-counted independently (tests/data/verify_abroad_history.py, 0 differences
#            or no commit). The monthly job (monthly.yml) recomputes it with the window; here only on pull requests.
# The build sandbox reaches only GitHub, so real-data work runs here. On pull requests from this repository both
# jobs commit their file to the pull request's branch (trial data to review), never to main.
on:
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/foreign_stops.mjs
      - scripts/abroad_history.py
      - tests/data/verify_abroad_history.py
      - tests/data/test_abroad_history.py
      - tests/data/probe_abroad.py
      - .github/workflows/abroad.yml

permissions:
  contents: write

concurrency:
  # Scheduled runs one at a time; each pull request push runs on its own (the trial commits rebase onto each other).
  group: abroad-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  stops:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          fetch-depth: 0

      # Pull requests: read Transitous again only when the script changed after the last trial data (light use).
      - name: Is a new trial needed?
        id: need
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f data/foreign-stops.json ] && \
             [ "$(git log -1 --format=%ct -- data/foreign-stops.json)" -ge "$(git log -1 --format=%ct -- scripts/foreign_stops.mjs lib/tripStops.cjs)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Trial data is newer than the script: skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4.4.0
        if: steps.need.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Stops abroad from Transitous
        if: steps.need.outputs.run == 'true'
        run: |
          before=$(node -e "try{console.log(Object.keys(require('./data/foreign-stops.json').trains).length)}catch{console.log(0)}")
          node scripts/foreign_stops.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          after=$(node -e "console.log(Object.keys(require('./data/foreign-stops.json').trains).length)")
          echo "trains with stops abroad: $before -> $after" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$after" -lt "$before" ] || [ "$after" -lt 60 ]; then echo "REFUSE: shrank or too few"; exit 1; fi

      - name: Commit data/foreign-stops.json
        if: steps.need.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then echo "Data unchanged."; exit 0; fi
          if [ "$changed" != " M data/foreign-stops.json" ] && [ "$changed" != "?? data/foreign-stops.json" ]; then
            echo "Unexpected changes, not committing:"; echo "$changed"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foreign-stops.json
          git commit -m "data: stops abroad ($(node -e "console.log(Object.keys(require('./data/foreign-stops.json').trains).length)") trains)"
          branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0
            sleep $((i * 10))
          done
          exit 1

  history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Script and verifier on synthetic files (no network)
        run: python tests/data/test_abroad_history.py

      - name: History abroad for the site's window
        run: python scripts/abroad_history.py --cache "$RUNNER_TEMP/abroad"

      - name: Independent recount of every cell (0 differences or no commit)
        run: python tests/data/verify_abroad_history.py --cache "$RUNNER_TEMP/abroad" | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" = 0

      - name: Gate (window, coverage, size)
        run: python scripts/abroad_history.py --cache "$RUNNER_TEMP/abroad" --check

      # Two cells by hand with awk straight from the raw files (a third way to count; compare with the file in the summary).
      - name: Hand check (awk on the raw files)
        run: |
          cd "$RUNNER_TEMP/abroad"
          {
          echo "ICE 220 arriving Amsterdam Centraal (RdT): measured, avg, % 15+"
          zcat rdt-services-*.csv.gz | awk -F, '$3=="ICE" && $5=="220" && $11=="Amsterdam Centraal" && $12!="" && $14!="true" && $13!="" && $13>=-10 && $13<=600 {n++; s+=$13; if ($13>=15) l++} END {printf "  %d, %.1f, %.1f\n", n, s/n, 100*l/n}'
          echo "ICE 121 leaving Amsterdam Centraal (RdT): measured, avg, % 15+"
          zcat rdt-services-*.csv.gz | awk -F, '$3=="ICE" && $5=="121" && $11=="Amsterdam Centraal" && $15!="" && $17!="true" && $16!="" && $16>=-10 && $16<=600 {n++; s+=$16; if ($16>=15) l++} END {printf "  %d, %.1f, %.1f\n", n, s/n, 100*l/n}'
          echo "ICE 10 arriving Liege-Guillemins (Infrabel): measured, avg, % 15+"
          cat infrabel-*.csv | awk -F, '$4=="ICE" && $3=="10" && $9=="LIEGE-GUILLEMINS" && $16!="" && $16!=$17 && $19!="" {d=int($19/60); if (d>=-10 && d<=600) {n++; s+=d; if (d>=15) l++}} END {printf "  %d, %.1f, %.1f\n", n, s/n, 100*l/n}'
          cd "$GITHUB_WORKSPACE"
          python -c "import json; t=json.load(open('data/abroad-history.json'))['trains']; print('file: ICE 220 Amsterdam', t['ICE 220']['Amsterdam Centraal'][2:5], '| ICE 121 Amsterdam (departure)', t['ICE 121']['Amsterdam Centraal'][5:8], '| ICE 10 Liege', t['ICE 10']['Liège-Guillemins'][2:5])"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit data/abroad-history.json to the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then echo "Data unchanged."; exit 0; fi
          if [ "$changed" != " M data/abroad-history.json" ] && [ "$changed" != "?? data/abroad-history.json" ]; then
            echo "Unexpected changes, not committing:"; echo "$changed"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abroad-history.json
          git commit -m "data: history abroad (trial run on the committed window)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.head_ref }}" && git push origin "HEAD:${{ github.head_ref }}" && exit 0
            sleep $((i * 10))
          done
          exit 1

  # Diagnostic of every source (layouts, licences, archives): run by hand from the Actions tab.
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Probe sources (diagnostic)
        continue-on-error: true
        run: python tests/data/probe_abroad.py --part round4
