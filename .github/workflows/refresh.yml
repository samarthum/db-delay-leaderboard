name: Refresh data

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - id: check
        run: python scripts/compute.py --check-window

      - if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/compute.py

      - if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Data unchanged."
            exit 0
          fi
          window=$(python -c "import json; w = json.load(open('data/stats.json'))['window']; print(w['firstMonth'] + '..' + w['lastMonth'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh stats (window $window)"
          git push
